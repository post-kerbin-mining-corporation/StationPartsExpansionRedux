    #LOC_SSPX_ScienceDef_TelescopeObservation_SunInSpaceHigh = 你观察太阳。 只有在听到“温度异常”警报后才想起忘记安装太阳能过滤器。 这是一个实打实的伊卡洛斯时刻。[译者注: 希腊神话, 伊卡洛斯是一个试图用蜡和羽毛制成的翅膀逃离克里特岛的年轻人，因为飞的太高以至于他的翅膀被太阳的热量融化，最终了堕海身亡。]

    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinInSpaceLow = 除了大气湍流的影响之外，该望远镜能够在比地面更宽的视野范围内达到更一致的高分辨率。 在你得到坎巴拉天文学会的命令之前，你会利用时间来分裂一些你还没有看到的双星。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinInSpaceHigh = 远离坎星，天文台能够在几乎没有干扰的情况下观察到大部分天空。 你开始对遥远的星系进行调查。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinSrfLandedDesert = 在坎星的大气中，大气湍流导致图像沸腾和闪烁，导致分辨率降低。 行星成像必须使用极短曝光和数字处理来叠加图像。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinSrfLandedHighlands = 天文台相对不受低层雾和大气观测条件的一些影响，允许比海平面更高的分辨率。 尽管如此，它并不是高分辨率成像的最佳场所，因此您最关心的是组装更大的深空马赛克天体。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinSrfLandedMountains = 这是一个远程天文台的好地方。 远在光污染和大气湍流的影响之上，天空以清晰、高分辨率的细节呈现————尽管太空会更好。 您使用 SLIPPIST 相机搜索附近的系外行星凌日事件。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinSrfLandedWater = 海浪和沙子进入仪器。 这将是一个维护噩梦。 你试图做一些成像，但在雾气、湍流的空气和海浪之间，这个观察会是一次洗涤。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinSrfSplashedWater = 海浪和沙子进入仪器。 这将是一个维护噩梦。 你试图做一些成像，但在雾气、湍流的空气和海浪之间，这个观察会是一次洗涤。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinSrfLandedWater = 海浪和沙子进入仪器。 这将是一个维护噩梦。 你试图做一些成像，但在雾气、湍流的空气和海浪之间，这个观察会是一次洗涤。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinSrfLandedKSC = KSC 的光污染使得观察深空天体非常不切实际。 如果你想看夜空，你真的需要走到偏僻的地方。 尽管如此，这是一个公共赏Mun的好地方，也许 Walt Kerman 和他的公关团队知道如何做到这一点。
    #LOC_SSPX_ScienceDef_TelescopeObservation_KerbinSrfLanded =  从kerbin的大气层内观察，大气湍流导致图像闪烁抖动，分辨率降低。行星成像必须采用极短曝光时间，并通过数字处理进行图像叠加。


    #LOC_SSPX_ScienceDef_TelescopeObservation_MunInSpaceLow = 如果您可以放慢速度，该仪器将能够获得极高分辨率的表面图像。 事实上，你几乎不需要派遣坎星人！ 毕竟，当你有天文学家时，谁还需要宇航员。
    #LOC_SSPX_ScienceDef_TelescopeObservation_MunInSpaceHigh = 将天文台指向地表可以进行高分辨率地面测绘，但我们只装了天文传感器，所以你必须满足于解开宇宙的奥秘。
    #LOC_SSPX_ScienceDef_TelescopeObservation_MunSrfLanded = 这是一个近在咫尺的深空天文台的好地方！ 天空真的很流行，无论白天黑夜。
 
