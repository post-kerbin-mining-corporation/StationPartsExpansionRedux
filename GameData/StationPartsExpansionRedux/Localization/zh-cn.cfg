    // Plant Growth
    // Credit JadeOfMaarr
    #LOC_SSPX_ScienceDef_PlantGrowth_Title = 植物生长实验报告
    #LOC_SSPX_ScienceDef_PlantGrowth_default = 这些植物是最醇厚和宁静的。注意，你现在还不能收集.

    #LOC_SSPX_ScienceDef_PlantGrowth_SunInSpaceLow = 气候传感器的指针接近危险水准。看在你最喜欢的厨师的份上，把百叶窗关上!
    #LOC_SSPX_ScienceDef_PlantGrowth_SunInSpaceHigh = 你打开百叶窗，看看它对植物的影响可能有什么不同，现在你已经超出了人类的影响…和它的保护……植物明显地很快枯萎。你要做个记录，绝对不要再这样做了。

    #LOC_SSPX_ScienceDef_PlantGrowth_KerbinInSpaceLow = 这些植物生长得很慢，如果是的话。现在出现任何值得注意的结果可能还为时过早。
    #LOC_SSPX_ScienceDef_PlantGrowth_KerbinInSpaceHigh = 你打开百叶窗，看看它会对植物产生什么影响。没有任何事情立即发生，但后来你马上记录下其中之一株植物已经枯萎，并可能已经烧毁路，特别是这是一株向阳植物。这不是一个好兆头。
    #LOC_SSPX_ScienceDef_PlantGrowth_KerbinSrfLanded = 植物闪闪发光。他们在这里一定很高兴。

    #LOC_SSPX_ScienceDef_PlantGrowth_MunInSpaceLow = 这株较高的植物向Mun倾斜。看到了吗?是受引力作用吗?
    #LOC_SSPX_ScienceDef_PlantGrowth_MunInSpaceHigh = 当你研究这些植物时，你考虑了在Mun表面种植的可能性。
    #LOC_SSPX_ScienceDef_PlantGrowth_MunSrfLanded = 你很想把一些Mun的土壤铲到花盆里，然后播种。然而，要让这个梦想生根发芽，还需要削减一些繁文缛节。
    #LOC_SSPX_ScienceDef_PlantGrowth_MunSrfLanded = 你取一些Mun的土壤，把它放在一个有记号的花盆里。生长速度似乎没有变化，但是，似乎长出果实的速度要比在kerbin中慢

    #LOC_SSPX_ScienceDef_PlantGrowth_Minmus_InSpaceLow = 有几片叶子似乎变色了。他们似乎试图与Minmus建立某种形式的联系.
    #LOC_SSPX_ScienceDef_PlantGrowth_Minmus_InSpaceHigh = 这些植物被Minmus所吸引. 这怎么可能呢?毕竟Minmus的引力是如此的小
    #LOC_SSPX_ScienceDef_PlantGrowth_MinmusSrfLanded = Minmus是冰淇淋做的吗?植物会在里面生长吗?你请求R&D允许你做这个测试。
    #LOC_SSPX_ScienceDef_PlantGrowth_MinmusSrfLanded = 你拿一些Minmus土，把它涂在一个有记号的罐子上。它开始枯萎……你发现这片土壤过于潮湿，而且营养成分有高有低。

    #LOC_SSPX_ScienceDef_PlantGrowth_MohoInSpaceLow = 这些植物的颜色变暗了一点，但它们看起来和以前一样好.
    #LOC_SSPX_ScienceDef_PlantGrowth_MohoInSpaceHigh = 你在样本植物的土壤中发现一个大洞，而植物本身却不见了……沃日深空海妖?
    #LOC_SSPX_ScienceDef_PlantGrowth_MohoSrfLanded = 实际上你对这块土壤取样做实验的想法很担心。你犹犹豫豫开始做了。
    #LOC_SSPX_ScienceDef_PlantGrowth_MohoSrfLanded = 考虑到这里相当极端的情况，你准备了两个有记号的带有Moho土壤的罐子。一株枯萎了，另一株长的高但不结果实。后来的诊断表明，植物化学对Moho很挑剔。

    #LOC_SSPX_ScienceDef_PlantGrowth_EveInSpaceLow = 现在被Eve捕获了，你想知道他们是改变主意了，还是真正的重力吸引了他们。
    #LOC_SSPX_ScienceDef_PlantGrowth_EveInSpaceHigh = 植物往Eve方向相反的地方靠拢……它们一定不喜欢这里.
    #LOC_SSPX_ScienceDef_PlantGrowth_EveSrfLanded = 植物在这里长得又粗又短，高的部分还枯萎了。Eve的引力一定压倒了他们。
    #LOC_SSPX_ScienceDef_PlantGrowth_EveSrfLanded = 当你用潮湿的紫色土壤接近样本植物时，它马上枯萎了。这东西太可怕了。
    #LOC_SSPX_ScienceDef_PlantGrowth_EveSrfLanded = 你取一些EVe的土壤，涂在两个有记号的罐子上。你注意到其中一个枯萎了，很可能是中毒引起的，而另一个，恰好是兰花，疯狂地生长，像海怪的触角一样缠绕着花盆。

    #LOC_SSPX_ScienceDef_PlantGrowth_GillyInSpaceLow = 哦，看，一个长出来的水果。你注意到它的存在，并作出一个平安无事的判断。
    #LOC_SSPX_ScienceDef_PlantGrowth_GillyInSpaceHigh = 这些植物没有表现出明显的新特征。他们肯定没有发现Gilly。
    #LOC_SSPX_ScienceDef_PlantGrowth_GillySrfLanded = 你会发现为实验提取土壤样本特别困难。要是Gilly再大一点就好了。
    #LOC_SSPX_ScienceDef_PlantGrowth_GillySrfLanded = 你取一些Gilly土壤，把它涂在一个有标记的花盆里。无论好坏，植物都没有反应，所以Gilly一定是合适的。

    #LOC_SSPX_ScienceDef_PlantGrowth_IkeInSpaceLow = 这些植物被Ike所吸引。这些植物喜欢Ike。
    #LOC_SSPX_ScienceDef_PlantGrowth_IkeInSpaceHigh = 过境时间似乎很准。季节性的植物正在开花。
    #LOC_SSPX_ScienceDef_PlantGrowth_IkeSrfLanded = 你取一些Ike土壤，把它涂在一个有标记的花盆里。看起来Mun有竞争对手。
    #LOC_SSPX_ScienceDef_PlantGrowth_IkeSrfLanded = 你取一些Ike土壤，把它涂在一个有标记的罐子上。它没有显示任何新的行为，并且被证实是正确的。

    #LOC_SSPX_ScienceDef_PlantGrowth_DunaInSpaceLow = 这些植物正在盛开。现在正是殖民Duna的好时机。
    #LOC_SSPX_ScienceDef_PlantGrowth_DunaInSpaceLow = 你想知道这些植物到底是怎么看待这颗红色行星的，考虑到它们对kerbin的卫星的兴趣
    #LOC_SSPX_ScienceDef_PlantGrowth_DunaInSpaceHigh = 你注意到水果和花朵中有一种温和但越来越红的颜色。
    #LOC_SSPX_ScienceDef_PlantGrowth_DunaSrfLanded = 你取了一捧Duna土，把它放在一个有记号的花盆里. 这种植物显示出饥饿的迹象，甚至可能中毒。你判定这里面的金属含量太高了!

    #LOC_SSPX_ScienceDef_PlantGrowth_DresInSpaceLow = 植物不再有反应。它们是成熟的，以正常的速度生长。
    #LOC_SSPX_ScienceDef_PlantGrowth_DresInSpaceHigh = 这些植物分泌出水滴，它们有的松散地漂浮着，有的慢慢地落回土壤中。也许他们在表现更多的情感?他们是在哭吗?”
    #LOC_SSPX_ScienceDef_PlantGrowth_DresSrfLanded = 你拿一些土，把它放在有记号的花盆里。植物因饥饿而枯萎。这就好像植物没有或不能意识到土壤的存在。
    #LOC_SSPX_ScienceDef_PlantGrowth_DresSrfLanded = 你取一些土壤，把它涂在一个有标记的花盆上。它们没有显示出新的特性，这意味着Dres一定适合耕种。
      
    #LOC_SSPX_ScienceDef_PlantGrowth_JoolInSpaceLow =植物又开始闪耀。Jool一定很吸引他们。
    #LOC_SSPX_ScienceDef_PlantGrowth_JoolInSpaceHigh = 这些植物趋向于成熟。也许有绿色的身体。
    #LOC_SSPX_ScienceDef_PlantGrowth_JoolSrfLanded = 在让任何外部环境进入这个温室之前，你要花一点时间好好想想。
    #LOC_SSPX_ScienceDef_PlantGrowth_JoolSrfLanded = ...蛤蛤

    #LOC_SSPX_ScienceDef_PlantGrowth_LaytheInSpaceLow = 这些植物开始开花比预期的要早。即使是在这么高的地方，它也一定对它们产生了某种有益的影响。
    #LOC_SSPX_ScienceDef_PlantGrowth_LaytheInSpaceHigh = 这些植物看起来非常明亮和健康。好像他们
    #LOC_SSPX_ScienceDef_PlantGrowth_LaytheSrfLanded = 你取一些层土，把它放在一个有标记的花盆里。植物枯萎了，你确定水分过多，可能还有另一种极端的营养失衡。
    #LOC_SSPX_ScienceDef_PlantGrowth_LaytheSrfLanded = 你取一些层土，把它放在一个有标记的花盆里。它长得很好，甚至比在Kerbin上生长得更快、更饱满。

    #LOC_SSPX_ScienceDef_PlantGrowth_VallInSpaceLow = 没有什么不寻常的事情发生。然而，似乎是时候摘一些水果了。
    #LOC_SSPX_ScienceDef_PlantGrowth_VallInSpaceHigh = 这次植物没有表现出任何兴奋的迹象。这种情况似乎微不足道。
    #LOC_SSPX_ScienceDef_PlantGrowth_VallSrfLanded = 你拿一了Vally的土壤，把它放在一个有标记的花盆里。土壤似乎有很强的水分和营养的不平衡，但在可容忍的范围内，因为植物最终没有显示出死亡的迹象。

    #LOC_SSPX_ScienceDef_PlantGrowth_TyloInSpaceLow = 植物的引力更大。它会温和地提醒你飞船的轨道有多低。
    #LOC_SSPX_ScienceDef_PlantGrowth_TyloInSpaceHigh = 几片植物的叶子微微弯曲，这是典型的引力作用，但这次很假。当然，即使他们也承认这个可怕的月亮的威力。
    #LOC_SSPX_ScienceDef_PlantGrowth_TyloSrfLanded = 你取一些泰洛土，把它放在一个有记号的花盆里。这土壤一定很干，或者可能含有令人不快的东西。

    #LOC_SSPX_ScienceDef_PlantGrowth_BopInSpaceLow = 一些松散的花瓣四处飘浮。当你注意到它们的时候，会有更多的反弹。你可以说那些碎片到处乱飞。
    #LOC_SSPX_ScienceDef_PlantGrowth_BopInSpaceHigh = 当你进行这个实验时，你想知道这艘船是否真的在Bop的影响范围内……你也想知道植物是否意识到了Bob的影响
    #LOC_SSPX_ScienceDef_PlantGrowth_BopSrfLanded =你拿一些Bob的土壤，把它放在一个有标记的花盆里。植物会慢慢枯萎，但这是意料之中的。在离恒星这么远的地方，在卫星上不太可能存在必要的微生物。

    #LOC_SSPX_ScienceDef_PlantGrowth_PolInSpaceLow = 你注意到有些植物变黄了…这值得仔细调查.
    #LOC_SSPX_ScienceDef_PlantGrowth_PolInSpaceHigh = 植物似乎正在开花. 它们的花期提前了吗?
    #LOC_SSPX_ScienceDef_PlantGrowth_PolSrfLanded = 你去拿了Pol的土回来, 然后把它放在有记号的罐子上. 植物逐渐枯萎, 但这是意料之中的. 在这样一个远离任何事物的世界上, 微生物基本不太可能存在. 

    #LOC_SSPX_ScienceDef_PlantGrowth_EelooInSpaceLow = 你控制飞船面向这颗星球, 熄掉灯, 观察着温室, 你好像玩了一局有史以来载入时间最长的游戏...可惜并没有什么特别的事情发生.
    #LOC_SSPX_ScienceDef_PlantGrowth_EelooInSpaceHigh = 你关掉照耀着一两个特定温室的日光灯, 部分是为了节约电力, 但主要是为了对Eeloo的环境进行早期测试.
    #LOC_SSPX_ScienceDef_PlantGrowth_EelooSrfLanded = 你取回了些Eeloo土壤, 然后把它放在一个有记号的罐子上. 植物开始慢慢枯萎, 幸好你离这有一公里外. 看来太多的冰和没有必要的微生物会导致不愉快的测试结果.

    // Visual Obs
    //Credit Rock3tman
    #LOC_SSPX_ScienceDef_VisualObservation_Title = 乘员报告
    #LOC_SSPX_ScienceDef_VisualObservation_default = 你看着窗外的风景。

    #LOC_SSPX_ScienceDef_VisualObservation_SunInSpaceLow = 这盏灯是绝对致盲的，你只能向外看一小段时间，然后才能离开它的力量。
    #LOC_SSPX_ScienceDef_VisualObservation_SunInSpaceHigh = 太空是如此的贫瘠，数百万公里之外什么都看不见。

    #LOC_SSPX_ScienceDef_VisualObservation_KerbinInSpaceLow = 就像一幅画。你看到充满活力的绿色、蓝色和古铜色从你身边经过，不得不惊叹于它的美丽。
    #LOC_SSPX_ScienceDef_VisualObservation_KerbinInSpaceHigh = 从这里看，所有的历史都显得那么渺小和微不足道。所有这些都用一个淡蓝色的圆点表示。
    #LOC_SSPX_ScienceDef_VisualObservation_KerbinSrfLanded = 是的，这是一个窗户。那个价格真的很贵.

    #LOC_SSPX_ScienceDef_VisualObservation_MunInSpaceLow = 庄严的灰色从你身边经过，山峦和山谷似乎完全荒凉和陌生。
    #LOC_SSPX_ScienceDef_VisualObservation_MunInSpaceHigh = 从这个角度看，Mun和Kerbin似乎以平等的伙伴关系统治着天空。
    #LOC_SSPX_ScienceDef_VisualObservation_MunSrfLanded = 你举起大拇指，把Kerbin涂掉。你突然觉得自己非常非常谦卑。

    #LOC_SSPX_ScienceDef_VisualObservation_Minmus_InSpaceLow = 连绵起伏的丘陵和壮丽的高原让位给了一眼所能看到的陡峭的悬崖和平地。这些公寓似乎是很有希望的着陆地点。
    #LOC_SSPX_ScienceDef_VisualObservation_Minmus_InSpaceHigh = Minmus在夜空中仍然很小，还没有明显的特征。
    #LOC_SSPX_ScienceDef_VisualObservation_MinmusSrfLanded = 一种薄荷绿，一眼就能看到，潜意识里让你渴望某种甜点。你把这些想法抛到一边，因为这里没有好吃的。

    #LOC_SSPX_ScienceDef_VisualObservation_MohoInSpaceLow = 这颗行星似乎被烧到了它的核心，受到了撞击的冲击，被太阳的烤了数十亿年。
    #LOC_SSPX_ScienceDef_VisualObservation_MohoInSpaceHigh = 你凝视着Moho深棕色的表面，想着你在窗边的时候把它晒黑了多少。
    #LOC_SSPX_ScienceDef_VisualObservation_MohoSrfLanded = 你甚至要眯着眼睛才能看清周围的岩石，而且窗户里的空气很热。

    #LOC_SSPX_ScienceDef_VisualObservation_EveInSpaceLow = Eve的银色海洋和紫色土壤在下面不祥地等待着。
    #LOC_SSPX_ScienceDef_VisualObservation_EveInSpaceHigh = 尽管距离遥远，但Eve的大小和颜色在夜空中令人肃然起敬。
    #LOC_SSPX_ScienceDef_VisualObservation_EveSrfLanded = 有毒的紫色风拍打着窗户，慢慢地侵蚀着玻璃。你感觉不舒服。

    #LOC_SSPX_ScienceDef_VisualObservation_IkeInSpaceLow = 在我看来就像Mun。
    #LOC_SSPX_ScienceDef_VisualObservation_IkeInSpaceHigh = 不管你是偶然来的还是故意来的，Ike都不怎么好看。你把视线转回到Duna身上。
    #LOC_SSPX_ScienceDef_VisualObservation_IkeSrfLanded = 仔细观察一下，Ike的深灰色岩石看起来很有趣。你希望你没有对Ike作出如此严厉的判断。

    #LOC_SSPX_ScienceDef_VisualObservation_DunaInSpaceLow = 你可以辨认出古代红色山谷、河床和湖泊的痕迹。他们怎么了?
    #LOC_SSPX_ScienceDef_VisualObservation_DunaInSpaceHigh = Duna鲜艳的红色和白色在天空的衬托下显得格外醒目。它看起来更具威胁
    #LOC_SSPX_ScienceDef_VisualObservation_DunaSrfLanded = 虽然土壤和天空锈迹斑斑的红色让人感到陌生，但你可以把这里当成你未来的家。

    #LOC_SSPX_ScienceDef_VisualObservation_DresInSpaceLow = 这颗行星大部分都很无聊，但明亮的灰色部分、深深的峡谷和坑坑洼洼的陨石坑很值得一看。
    #LOC_SSPX_ScienceDef_VisualObservation_DresInSpaceHigh = 什么?这里有颗行星?我没看到。
    #LOC_SSPX_ScienceDef_VisualObservation_DresSrfLanded = 地形比你想象的要有趣, 但这趟旅行还是太长了, 不值得.

    #LOC_SSPX_ScienceDef_VisualObservation_JoolInSpaceLow = 映入你眼帘的是整个Jool的绿云带, 你仿佛在一个微妙的舞蹈着的气体里.
    #LOC_SSPX_ScienceDef_VisualObservation_JoolInSpaceHigh = 在这遥远的地方，Jool有趣的行星系统向你招手. 如此接近, 却如此遥远.
    #LOC_SSPX_ScienceDef_VisualObservation_JoolSrfLanded = 你还不知道你的窗户为什么还没碎.

    #LOC_SSPX_ScienceDef_VisualObservation_LaytheInSpaceLow = Laythe上的浅海滩, 与世隔绝的岛屿, 以及充满活力的蓝色大气, 仿佛在求你去降落和定居. 
    #LOC_SSPX_ScienceDef_VisualObservation_LaytheInSpaceHigh = 一个个小小的岛链好像在述说着一个未被接触的天堂等待探索。
    #LOC_SSPX_ScienceDef_VisualObservation_LaytheSrfLanded = 海岸线的景色缓和着你的神经, 海浪拍打岸边的声音环绕着你. 远处, 一个绿色的气态巨行星在提醒着你，这天空属于其他星球.

    #LOC_SSPX_ScienceDef_VisualObservation_VallInSpaceLow = 尽管有着有趣的颜色, Vall并没有什么可看的. 至少, 和Jool相比.
    #LOC_SSPX_ScienceDef_VisualObservation_VallInSpaceHigh = 这个蓝色的球看起来和Laythe明显不同. 你想知道要把冰变成海洋需要什么. 
    #LOC_SSPX_ScienceDef_VisualObservation_VallSrfLanded = 如果你是色盲, 你就没有办法区分Vall和Minmus. 你知道, 除了天空中巨大的绿色球. 

    #LOC_SSPX_ScienceDef_VisualObservation_TyloInSpaceLow = 你觉得再靠近这颗卫星就意味着你的末日到了. 你果断远离窗户.
    #LOC_SSPX_ScienceDef_VisualObservation_TyloInSpaceHigh = Tylo在这个有利的位置统治着这片地区，就像Jool一样. 你想象着这些卫星为了统治力而争斗. 
    #LOC_SSPX_ScienceDef_VisualObservation_TyloSrfLanded = Tylo的表面都是岩石, 还有点无聊，但仍然有点吓人.你觉得被困住了. 

    #LOC_SSPX_ScienceDef_VisualObservation_BopInSpaceLow = 虽然Bop并不开口说话, 但船上奇怪的噪音让你觉得你在这里不受欢迎.
    #LOC_SSPX_ScienceDef_VisualObservation_BopInSpaceHigh = 和Jool的其他卫星相比, 这颗只是一个棕色的斑点.
    #LOC_SSPX_ScienceDef_VisualObservation_BopSrfLanded = 虽然地表荒芜荒凉, 但你却感到寒意, 仿佛有一股强大的力量在注视着你.

    #LOC_SSPX_ScienceDef_VisualObservation_PolInSpaceLow = Pol凹凸不平的表面在许多山谷上投下深长的阴影. 
    #LOC_SSPX_ScienceDef_VisualObservation_PolInSpaceHigh = 尽管只是一个斑点, Pol独特的颜色给了它一个神秘的大气和在Jool系统的重要性. 
    #LOC_SSPX_ScienceDef_VisualObservation_PolSrfLanded = 有意思, 在洞穴般的山谷和高耸的山丘中, 崎岖的形状从表面突出来. 这是一个需要探索的地方. 

    #LOC_SSPX_ScienceDef_VisualObservation_EelooInSpaceLow = 船员们冰冷的心情通过看你下面的世界而得到缓解. 你不想在黄雪中降落. 
    #LOC_SSPX_ScienceDef_VisualObservation_EelooInSpaceHigh = 在如此遥远的地方, 孤独达到了新的水平. 黯淡的太阳光什么也帮不上. 
    #LOC_SSPX_ScienceDef_VisualObservation_EelooSrfLanded = 尽管距离遥远, 这个地方似乎有点像家, — 像Kerbin的冬天. 

    // Fish Study
    #LOC_SSPX_ScienceDef_FishStudy_Title = 水生物种观察报告
    #LOC_SSPX_ScienceDef_FishStudy_default =  水泵设备嗡嗡作响, 鱼在水箱周围快乐的游来游去。

    #LOC_SSPX_ScienceDef_FishStudy_SunInSpaceLow = 鱼露出了白白的肚皮，虾也变红了。好吧，节省了做饭的时间!
    #LOC_SSPX_ScienceDef_FishStudy_SunInSpaceHigh = 水箱中不同物种的缓慢旋转与你对日冕的观察相符。

    #LOC_SSPX_ScienceDef_FishStudy_KerbinInSpaceLow = 这鱼似乎有点不舒服。也许他们渴望看到舷窗外的广阔海洋。
    #LOC_SSPX_ScienceDef_FishStudy_KerbinInSpaceHigh = 你测量鱼的生物物理特性。似乎缺钙的现象开始多了起来。
    #LOC_SSPX_ScienceDef_FishStudy_KerbinSrfLanded = 所有生物似乎都在它的水箱里快乐地游来游去。

    #LOC_SSPX_ScienceDef_FishStudy_MunInSpaceLow = Mun表面的荒凉甚至没有一丝水的迹象。你几乎觉得鱼明白这一点，因为他们远离水箱的侧面。
    #LOC_SSPX_ScienceDef_FishStudy_MunInSpaceHigh = 当你在这个星球上疾驶时，你开始考虑在水箱热交换器上烤鱼的可行性。
    #LOC_SSPX_ScienceDef_FishStudy_MunSrfLanded = 低重力似乎有点把鱼抛了出去——它们不规则地上下摆动。不过大虾们似乎很开心。

    #LOC_SSPX_ScienceDef_FishStudy_Minmus_InSpaceLow = 鱼和薄荷冰淇淋搭配得太好了——哦，对不起，我本来要开这个光谱分析仪的……
    #LOC_SSPX_ScienceDef_FishStudy_Minmus_InSpaceHigh =  当水泵设备嗡嗡作响时，鱼在水箱周围欢快地游来游去。
    #LOC_SSPX_ScienceDef_FishStudy_MinmusSrfLanded = 低重力对鱼和你来说都不算什么。你想知道KSC有没有想过把一条鱼放进一个带有EVA喷气背包的小太空服里。

    #LOC_SSPX_ScienceDef_FishStudy_MohoInSpaceLow = 当水泵设备努力使温度保持平衡时，鱼在水箱周围游来游去。
    #LOC_SSPX_ScienceDef_FishStudy_MohoInSpaceHigh = 你真希望旅途中带了几条热带鱼。油箱热交换器正在全速运转!
    #LOC_SSPX_ScienceDef_FishStudy_MohoSrfLanded = 啊,甜蜜的重力。你打赌你可以在外面热的岩石上煮鱼

    #LOC_SSPX_ScienceDef_FishStudy_EveInSpaceLow = Eve的紫色海洋在召唤我们!你迫不及待地想要测试鱼对地球上有趣的有色水的反应。
    #LOC_SSPX_ScienceDef_FishStudy_EveInSpaceHigh = 高速奔向这颗星球, 你想到的是鱼的味道和健康.
    #LOC_SSPX_ScienceDef_FishStudy_EveSrfLanded = 我的天!还有比这更快杀死那些鱼的办法吗!你内疚地把装有Eve水样的水罐放干, 隐约听到到水罐中辐射计数器的滴答声. 

    #LOC_SSPX_ScienceDef_FishStudy_GillyInSpaceLow = 你的直觉告诉你, 现在查看那些鱼是没有意义的. 不过, 你可以试着往水里加点东西……
    #LOC_SSPX_ScienceDef_FishStudy_GillyInSpaceHigh = 你的直觉告诉你, 鱼不会真的受到登陆这个星球的影响. 
    #LOC_SSPX_ScienceDef_FishStudy_GillySrfLanded = 你希望乘员们不会注意到你在水箱里放置的新岩石装饰. 那些鱼只是在那里漂而已!

    #LOC_SSPX_ScienceDef_FishStudy_IkeInSpaceLow = 喜欢Ike并不难，但鱼似乎不同意。
    #LOC_SSPX_ScienceDef_FishStudy_IkeInSpaceHigh = 这是一个养鱼的好地方。
    #LOC_SSPX_ScienceDef_FishStudy_IkeSrfLanded = 在Ike登陆后，你会发现鱼向舷窗挤去，凝视着远处宏伟的Duna升起的景象。

    #LOC_SSPX_ScienceDef_FishStudy_DunaInSpaceLow = 冰冠和灰尘!你觉得鱼会喜欢这个星球。
    #LOC_SSPX_ScienceDef_FishStudy_DunaInSpaceHigh = 在前往Duna的路上，你因为让鱼活了这么久而有一种成就感。
    #LOC_SSPX_ScienceDef_FishStudy_DunaSrfLanded = 有人用行星尘埃污染了油箱!红色有点令人担忧!

    #LOC_SSPX_ScienceDef_FishStudy_DresInSpaceLow = Dres附近很孤独, 但幸运的是有河豚陪伴着你.
    #LOC_SSPX_ScienceDef_FishStudy_DresInSpaceHigh = 而在这里, 漂浮在你的窄小的舱里, 你想起了罐装的鱼产品. 
    #LOC_SSPX_ScienceDef_FishStudy_DresSrfLanded = 没有人喜欢这里, 除了那些大虾.

    #LOC_SSPX_ScienceDef_FishStudy_JoolInSpaceLow = 当你观察这颗行星上多姿多彩的风暴时, 你突然意识到, 你在上次实验把温度计忘在鱼缸里了. 你赶紧把它拿走. 
    #LOC_SSPX_ScienceDef_FishStudy_JoolInSpaceHigh = 这颗绿色的星球让你想起了你昨晚喂鱼时再水化的豌豆. 
    #LOC_SSPX_ScienceDef_FishStudy_JoolSrfLanded = 鱼嘲笑着你愚蠢的行为.

    #LOC_SSPX_ScienceDef_FishStudy_LaytheInSpaceLow = 多么美丽的世界！你不知道下面有没有水生生物的标本可以添加到你的收藏中.
    #LOC_SSPX_ScienceDef_FishStudy_LaytheInSpaceHigh = 这个世界看起来对鱼很友好. 当你告诉鱼这个发现, 你感觉到它们并不在意. 
    #LOC_SSPX_ScienceDef_FishStudy_LaytheSrfLanded = 一些鱼不见了. 看来你的一个船员在接下来的几年里, 擅自将它们释放到了Laythe的大海海, 污染了它们. 

        #LOC_SSPX_ScienceDef_FishStudy_VallInSpaceLow = 冷!你打开水箱加热器. 鱼看起来开心了点. 
    #LOC_SSPX_ScienceDef_FishStudy_VallInSpaceHigh = 是时候拿出你的鱼生物光谱分析仪探测器了!不, 别偷笑了, 那不是双关语. 
    #LOC_SSPX_ScienceDef_FishStudy_VallSrfLanded = 你不由得的希望你带了一些冷水鱼. 你溶解在容器里的Vall冰封表面正在破坏温度分布.

    #LOC_SSPX_ScienceDef_FishStudy_TyloInSpaceLow = 鱼直直地看着你, 让你想重新考虑你的任务选择. 
    #LOC_SSPX_ScienceDef_FishStudy_TyloInSpaceHigh = Tylo的引力和Kerbin很相似, 所以你会认为鱼会很高兴. 相反, 它们并没有. 噢, 是的, 你还在轨道上.
    #LOC_SSPX_ScienceDef_FishStudy_TyloSrfLanded = 鱼儿在鱼缸底部闷闷不乐, 看上去很高兴能回到正常的重力状态, 但不知怎的被外面的光秃秃的景色所压抑.

    #LOC_SSPX_ScienceDef_FishStudy_BopInSpaceLow = 这些鱼似乎迷失了方向, 不断地互相攻击.
    #LOC_SSPX_ScienceDef_FishStudy_BopInSpaceHigh = 鱼一想到地心引力就兴奋起来, 开始扑向鱼缸的顶部.
    #LOC_SSPX_ScienceDef_FishStudy_BopSrfLanded = 科学日志, 补充: 这些鱼看起来很好吃, 但船长已经锁上了进出的舱门. 

    #LOC_SSPX_ScienceDef_FishStudy_PolInSpaceLow = 有些鱼的颜色与窗外的卫星相似. 真想不到！
    #LOC_SSPX_ScienceDef_FishStudy_PolInSpaceHigh = 生物光谱分析表明, 这条鱼很多骨头没有了, 看起来有点想吃. 你可能不需要以这种速度去骨. 
